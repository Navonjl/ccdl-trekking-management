apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek-api
  labels: {{- include "hitc.labels" . | nindent 4 }}
    app: trek-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: trek-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: trek-api
        azure.workload.identity/use: "true"
    spec:
      {{- include "hitc.podIdentity" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          {{- include "hitc.env" . | nindent 10 }}
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
# Internal; the ingress in edge.yaml is the public way in.
apiVersion: v1
kind: Service
metadata:
  name: trek-api
  labels: {{- include "hitc.labels" . | nindent 4 }}
spec:
  selector: { app: trek-api }
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trek-api
  labels: {{- include "hitc.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: trek-api }
  minReplicas: {{ .Values.api.minReplicas }}
  maxReplicas: {{ .Values.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.targetCPU }} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trek-api
  labels: {{- include "hitc.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: trek-api }
