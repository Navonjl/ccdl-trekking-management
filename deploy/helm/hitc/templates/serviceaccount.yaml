# Federated with the hitc-workload managed identity, so pods using this
# account get Entra tokens for Key Vault and Blob Storage with no stored key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  labels: {{- include "hitc.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.azure.workloadClientId | quote }}
