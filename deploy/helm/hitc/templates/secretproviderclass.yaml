# Pulls the secrets out of Key Vault with the workload identity and mirrors
# them into the hitc-secrets Secret, which the pods read as environment.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hitc-keyvault
  labels: {{- include "hitc.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    clientID: {{ .Values.azure.workloadClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
      {{- range $name, $_ := .Values.secrets }}
        - |
          objectName: {{ $name }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: hitc-secrets
      type: Opaque
      data:
      {{- range $name, $env := .Values.secrets }}
        - objectName: {{ $name }}
          key: {{ $env }}
      {{- end }}
